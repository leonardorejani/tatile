<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acme: pedidos</title>
<link rel="stylesheet" href="../../codigo/espaco.css">
<link rel="stylesheet" href="../../codigo/tipo.css">
<link rel="stylesheet" href="../../codigo/forma.css">
<link rel="stylesheet" href="../../codigo/cor.css">
<link rel="stylesheet" href="../../codigo/movimento.css">
<style>
  /* Tela de app com a tatile inteira. body[data-versao="sem"] desliga tudo: os mesmos
     componentes com valores soltos, como um app sem padrao. A troca anima no lugar. */
  :root { --t: 320ms cubic-bezier(.2, .8, .2, 1); }
  /* o zoom de monitor grande (espaco.css) e da tatile: o Sem nao tem */
  html:has(body[data-versao="sem"]) { zoom: 1; }
  /* Com a tatile toda transicao vem dos tokens de movimento (movimento.css). O Sem guarda o numero solto. */
  body[data-versao="com"] { --t: var(--mov-padrao) var(--curva-move); }
  * { box-sizing: border-box; }
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; transition: background-color var(--t), color var(--t); }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  body { --trans-base: padding var(--t), gap var(--t), height var(--t), min-height var(--t), font-size var(--t), border-radius var(--t), box-shadow var(--t), background-color var(--t), color var(--t), border-color var(--t), letter-spacing var(--t); }
  .card, .lista, .linha, .conteudo, .grade, .espaco, h1, h2, .numero, .sub, .pilula, .botao, .capa, .miniatura, .menu, .painel, .campo, .aba {
    transition: var(--trans-base);
  }
  /* retorno ao apertar: so no Com. A transicao do transform entra junto com a da lista */
  body[data-versao="com"] .apertavel { transition: var(--trans-base), transform var(--mov-rapido) var(--curva-move); }
  body[data-versao="sem"] .apertavel:active { transform: none; }

  /* ---------- "sem a tatile": valores soltos, tudo igual, cor fixa ---------- */
  body[data-versao="sem"] {
    --margem: 16px; --pad: 16px; --secao: 16px; --linha: 44px; --icone: 8px; --grade: 16px; --item: 8px; --conteudo-max: 100%;
    --texto-xs: 11px; --texto-sm: 13.5px; --texto-base: 14px; --texto-md: 16.5px; --texto-lg: 18px; --texto-xl: 21px; --texto-2xl: 22px;
    --raio-dentro: var(--raio-card);
    --sombra-1: none; --sombra-2: none; --sombra-3: 0 2px 8px rgb(0 0 0 / 0.35);
  }
  body[data-versao="sem"] .card, body[data-versao="sem"] .lista, body[data-versao="sem"] .menu, body[data-versao="sem"] .painel { background: #fff; color: #15181d; border: 1px solid #cfd4db; }
  body[data-versao="sem"] .sub, body[data-versao="sem"] .rotulo { color: #9a9a9a; }
  body[data-versao="sem"] h1, body[data-versao="sem"] h2 { text-wrap: wrap; letter-spacing: 0; }
  body[data-versao="sem"] .numero { font-variant-numeric: proportional-nums; }
  body[data-versao="sem"] img, body[data-versao="sem"] .miniatura { outline: none; }
  body[data-versao="sem"] .promo .sub { color: #9ca3af; }
  body[data-versao="sem"] .botao-sec { background: #eef0f3; color: #15181d; }
  body[data-versao="sem"] .lateral { background: #fff; color: #15181d; border-color: #e3e6eb; }
  body[data-versao="sem"] .alvo::after { width: 0; height: 0; }

  /* ---------- casca: barra no celular, menu lateral a partir de 768 ---------- */
  .app { display: flex; flex-direction: column; min-height: 100dvh; }
  .lateral { display: flex; align-items: center; gap: var(--item); height: 56px; padding: 0 var(--margem); background: var(--superficie); border-bottom: 1px solid var(--borda); transition: background-color var(--t), border-color var(--t), padding var(--t); }
  .lateral strong { font-size: var(--texto-md); }
  .lateral nav { display: none; }
  @media (min-width: 768px) {
    .app { flex-direction: row; }
    .lateral { flex-direction: column; align-items: stretch; width: 220px; height: auto; padding: 24px 12px; gap: 4px; border-bottom: 0; border-right: 1px solid var(--borda); flex: none; }
    .lateral strong { padding: 0 12px 16px; }
    .lateral nav { display: flex; flex-direction: column; gap: 4px; }
    .lateral nav a { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: var(--raio-sm); color: var(--texto-2); text-decoration: none; font-size: var(--texto-base); }
    .lateral nav a.ativo { background: var(--destaque-suave); color: var(--destaque); font-weight: 600; }
    .lateral nav i { width: 18px; height: 18px; border-radius: 5px; background: currentColor; opacity: .3; }
  }
  main { flex: 1; min-width: 0; }
  .conteudo { max-width: var(--conteudo-max); margin: 0 auto; padding: var(--margem) var(--margem) 120px; }
  .espaco { height: var(--secao); }

  .topo { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--grade); }
  .topo small { color: var(--texto-2); font-size: var(--texto-sm); }
  h1 { margin: 4px 0 0; font-size: var(--texto-2xl); max-width: 640px; }
  h2 { margin: 0; font-size: var(--texto-md); }
  .botao { flex: none; min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--raio); background: var(--destaque); color: var(--destaque-texto); font-weight: 600; font-size: var(--texto-base); }
  .botao-sec { min-height: 36px; padding: 0 14px; border: 0; border-radius: var(--raio-sm); background: var(--superficie-2); color: var(--texto); font-weight: 600; font-size: var(--texto-sm); }
  @media (max-width: 639px) { .topo .botao { display: none; } }

  .card { background: var(--superficie); color: var(--texto); border-radius: var(--raio-card); padding: var(--pad); box-shadow: var(--sombra-1); border: 1px solid transparent; }
  .grade { display: grid; gap: var(--grade); }
  /* o resumo olha a largura que sobrou pro conteudo (menu lateral come espaco no tablet), nao a da tela */
  .caixa-resumo { container-type: inline-size; }
  .resumo { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @container (max-width: 720px) { .resumo { grid-template-columns: 1fr 1fr; } .resumo > :first-child { grid-column: 1 / -1; } }
  .rotulo { color: var(--texto-2); font-size: var(--texto-sm); }
  .numero { display: block; white-space: nowrap; font-size: var(--texto-xl); font-weight: 700; letter-spacing: -0.01em; margin-top: 4px; }
  .sub { color: var(--texto-2); font-size: var(--texto-sm); }

  .titulo-secao { display: flex; align-items: center; justify-content: space-between; gap: var(--grade); margin-bottom: var(--item); }
  .abas { position: relative; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .aba { position: relative; z-index: 1; flex: none; min-height: 36px; padding: 0 12px; border: 0; border-radius: var(--raio-pilula); background: transparent; color: var(--texto-2); font-size: var(--texto-sm); font-weight: 600; }
  .aba.on { background: var(--texto); color: var(--fundo); }
  /* Com: um indicador so, que anda de uma aba pra outra (transform e width). A aba ativa fica sem fundo proprio */
  .ind { position: absolute; left: 0; top: 0; height: var(--h, 36px); width: var(--w, 0); transform: translateX(var(--x, 0)); border-radius: var(--raio-pilula); background: var(--texto); pointer-events: none; }
  body[data-versao="com"] .ind { transition: transform var(--mov-padrao) var(--curva-move), width var(--mov-padrao) var(--curva-move); }
  body[data-versao="com"] .aba.on { background: transparent; }
  body[data-versao="sem"] .ind { display: none; }
  /* Com: aba cortada vira esmaecimento, so do lado onde ha conteudo escondido (atualizado no scroll) */
  body[data-versao="com"] .abas[data-fade="dir"] { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
  body[data-versao="com"] .abas[data-fade="esq"] { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); }
  body[data-versao="com"] .abas[data-fade="ambos"] { -webkit-mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); }

  .lista { position: relative; background: var(--superficie); color: var(--texto); border-radius: var(--raio-card); padding: 0 var(--pad); box-shadow: var(--sombra-1); border: 1px solid transparent; min-height: 120px; }
  .linha { display: flex; align-items: center; gap: var(--icone); min-height: var(--linha); padding: 8px 0; }
  .linha + .linha { border-top: 1px solid var(--borda); }
  .miniatura { width: 40px; height: 40px; flex: none; border-radius: var(--raio-sm); outline: 1px solid var(--contorno-imagem); outline-offset: -1px; }
  .linha-texto { flex: 1; min-width: 0; }
  .linha-texto strong { display: block; font-size: var(--texto-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* a pilula desce pra linha de baixo: no celular o titulo nao quebra */
  .linha-texto .sub { display: flex; align-items: center; gap: 8px; margin-top: 4px; white-space: nowrap; }
  .corta { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* largura fixa: o texto ao lado comeca sempre no mesmo x. Ponto + contorno: le de longe */
  .pilula { --c: var(--sucesso); flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 92px; height: 22px; padding: 0 8px; font-size: var(--texto-xs); font-weight: 700; line-height: 1; border-radius: var(--raio-pilula); color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--superficie)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent); }
  .pilula::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pilula.enviado { --c: var(--destaque); }
  .pilula.cancelado { --c: var(--perigo); }
  @supports (text-box: trim-both cap alphabetic) { body[data-versao="com"] .pilula { text-box: trim-both cap alphabetic; } }
  body[data-versao="sem"] .pilula { min-width: 0; height: auto; padding: 3px 8px; background: var(--sucesso-suave); box-shadow: none; }
  body[data-versao="sem"] .pilula.enviado { background: var(--destaque-suave); }
  body[data-versao="sem"] .pilula::before { display: none; }
  .valor { flex: none; white-space: nowrap; font-weight: 600; font-size: var(--texto-base); }
  .acoes-linha { position: relative; flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--raio-sm); background: transparent; color: var(--texto-2); display: grid; place-items: center; }
  .acoes-linha svg { width: 16px; height: 16px; }

  .menu { position: absolute; right: 0; z-index: 5; width: 210px; padding: 4px; border-radius: var(--raio); background: var(--superficie); color: var(--texto); box-shadow: var(--sombra-3); border: 1px solid transparent; }
  .menu button { display: flex; width: 100%; min-height: 40px; align-items: center; padding: 0 10px; border: 0; border-radius: var(--raio-sm); background: transparent; text-align: left; font-size: var(--texto-base); }
  @media (hover: hover) and (pointer: fine) {
    .menu button:hover { background: var(--superficie-2); }
    .linha:hover .acoes-linha { background: var(--superficie-2); }
    .aba:not(.on):hover { color: var(--texto); }
  }
  .menu .perigo { color: var(--perigo); }
  /* escolheu: pisca UMA vez na cor de destaque e so entao fecha */
  .menu button.escolhido { animation: escolhido var(--mov-padrao) var(--curva-move) 1; }
  @keyframes escolhido { 0%, 55% { background: var(--destaque); color: var(--destaque-texto); } 100% { background: transparent; } }

  .sk { background: var(--superficie-2); border-radius: 6px; animation: pulso 1.2s ease-in-out infinite; }
  body[data-versao="sem"] .sk { background: #e3e6eb; }
  @keyframes pulso { 50% { opacity: .55; } }
  /* recarregar (so no Com): o mesmo botao que carrega do teste/movimento. A pilula fecha em circulo, entra o
     spinner, fica verde com check e a largura volta ao texto. Mesmo com resposta rapida o circulo fecha e gira. */
  .botao-sec.btn-c .rot { display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; }
  .icone-girar { width: 15px; height: 15px; flex: none; }
  [data-atualizar][aria-busy="true"] { cursor: progress; }
  body[data-versao="sem"] .icone-girar { display: none; }

  .vazio { text-align: center; padding: 32px 16px; color: var(--texto-2); font-size: var(--texto-sm); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .vazio .icone-vazio { width: 44px; height: 44px; border-radius: var(--raio); background: var(--destaque-suave); color: var(--destaque); display: grid; place-items: center; font-weight: 700; }
  .vazio strong { color: var(--texto); font-size: var(--texto-base); }

  .promo { background: var(--destaque-bloco); color: var(--destaque-bloco-texto); border: 0; display: grid; grid-template-columns: 1fr; gap: var(--item); }
  @media (min-width: 640px) { .promo { grid-template-columns: 160px 1fr; align-items: center; } }
  .promo .capa { height: 96px; border-radius: var(--raio-dentro); background: linear-gradient(135deg, rgb(255 255 255 / .35), rgb(255 255 255 / .05)); outline: 1px solid rgb(255 255 255 / .2); outline-offset: -1px; }
  .promo strong { font-size: var(--texto-md); }
  .promo .sub { color: var(--destaque-bloco-texto-2); }
  body[data-versao="sem"] .promo { background: #2563eb; color: #fff; border: 0; }

  .aviso { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 14px; border-radius: var(--raio); background: var(--texto); color: var(--fundo); font-size: var(--texto-sm); box-shadow: var(--sombra-3); white-space: nowrap; overflow: hidden; }
  .aviso button { border: 0; background: none; color: var(--destaque-suave); font-weight: 700; }
  /* Com: entra deslizando 16px com fade, sai mais rapido, e uma barra de 3px (linear) mostra quanto falta */
  .aviso i { display: none; }
  body[data-versao="com"] .aviso { z-index: 40; animation: aviso-entra var(--mov-padrao) var(--curva-entra) both; }
  body[data-versao="com"] .aviso.saindo { pointer-events: none; animation: aviso-sai var(--mov-sai-padrao) var(--curva-sai) both; }
  body[data-versao="com"] .aviso i { display: block; position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: var(--destaque); transform-origin: left; animation: barra var(--tempo, 3000ms) linear forwards; }
  @keyframes aviso-entra { from { opacity: 0; translate: 0 16px; } to { opacity: 1; translate: 0 0; } }
  @keyframes aviso-sai { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: 0 16px; } }
  @keyframes barra { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  .fundo-painel { position: fixed; inset: 0; z-index: 30; background: rgb(0 0 0 / .45); display: grid; place-items: end center; }
  @media (min-width: 640px) { .fundo-painel { place-items: center; } }
  .painel { width: min(440px, 100%); background: var(--superficie); color: var(--texto); border-radius: var(--raio-card) var(--raio-card) 0 0; padding: var(--pad); display: flex; flex-direction: column; gap: var(--item); border: 1px solid transparent; }
  @media (min-width: 640px) { .painel { border-radius: var(--raio-card); } }
  .painel h2 { font-size: var(--texto-lg); }
  /* Com: celular = painel de baixo (sobe em --mov-lento, segue o dedo, elastico no topo). Tablet e desktop = modal que cresce de .9 */
  body[data-versao="com"] .fundo-painel { background: rgb(0 0 0 / 0); transition: background-color var(--mov-sai-padrao) var(--curva-sai); }
  body[data-versao="com"] .fundo-painel.aberto { background: var(--veu-modal); transition: background-color var(--mov-padrao) var(--curva-entra); }
  body[data-versao="com"] .fundo-painel.saindo { pointer-events: none; }
  body[data-versao="com"] .painel { position: relative; transform: translateY(100%); transition: transform var(--mov-sai-lento) var(--curva-sai); }
  body[data-versao="com"] .fundo-painel.aberto .painel { transform: none; transition: transform var(--mov-lento) var(--curva-entra); }
  @media (max-width: 639px) {
    /* prolonga o fundo pra baixo: ao puxar alem do topo nao abre vao */
    body[data-versao="com"] .painel::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 200px; background: inherit; }
  }
  @media (min-width: 640px) {
    body[data-versao="com"] .painel { transform: scale(.9); opacity: 0; transition: transform var(--mov-sai-padrao) var(--curva-sai), opacity var(--mov-sai-padrao) var(--curva-sai); }
    body[data-versao="com"] .fundo-painel.aberto .painel { transform: none; opacity: 1; transition: transform var(--mov-padrao) var(--curva-entra), opacity var(--mov-padrao) var(--curva-entra); }
  }
  .alca { display: grid; place-items: center; height: 28px; margin: calc(var(--pad) * -1) calc(var(--pad) * -1) 0; cursor: grab; touch-action: none; user-select: none; }
  .alca::before { content: ""; width: 36px; height: 4px; border-radius: var(--raio-pilula); background: var(--borda); }

  /* rotulo que sobe pro canto: nasce dentro do campo e nunca some */
  .flut { position: relative; }
  .flut .campo { padding-right: 44px; }
  .flut .campo::placeholder { opacity: 0; }
  .flut .campo:focus::placeholder { opacity: 1; }
  .rot-flut { position: absolute; left: 8px; top: 0; height: 44px; max-width: calc(100% - 52px); display: flex; align-items: center; padding: 0 4px; font-size: 16px; color: var(--texto-2); background: transparent; pointer-events: none; white-space: nowrap; transform-origin: left center; transition: transform var(--mov-rapido) var(--curva-move), color var(--mov-rapido) var(--curva-move), background-color var(--mov-rapido) var(--curva-move); }
  .flut .campo:focus + .rot-flut, .flut .campo:not(:placeholder-shown) + .rot-flut, .flut .campo:autofill + .rot-flut { transform: translateY(-22px) scale(.8); background: var(--superficie); }
  .flut .campo:focus + .rot-flut { color: var(--destaque); }
  .campo.valido { border-color: var(--sucesso); }
  /* check com salto: so confirmacao pequena (--curva-salto) */
  .ok-campo { position: absolute; right: 12px; top: 11px; width: 22px; height: 22px; fill: none; stroke: var(--sucesso); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(.6); pointer-events: none; transition: transform var(--mov-padrao) var(--curva-salto), opacity var(--mov-rapido) var(--curva-move); }
  .flut[data-valido="true"] .ok-campo { opacity: 1; transform: none; }
  /* botao desabilitado de verdade e aria-disabled: segue focavel, o motivo vem escrito embaixo */
  .botao[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .motivo { min-height: 18px; margin-top: -4px; }
  /* botao que vira circulo ao enviar: fixa a largura, fecha ate a altura, entra o spinner, fica verde com check */
  .btn-c { position: relative; display: inline-grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 0; overflow: hidden; }
  .btn-c > * { grid-area: 1 / 1; }
  .btn-c .rot { padding: 0 18px; white-space: nowrap; }
  .btn-c .spin, .btn-c .ok { width: 22px; height: 22px; opacity: 0; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .btn-c .spin { animation: gira 800ms linear infinite; }
  .btn-c .ok path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset var(--mov-padrao) var(--curva-move); }
  body[data-versao="com"] .btn-c { transition: width var(--mov-padrao) var(--curva-move), background-color var(--mov-padrao) var(--curva-move), border-radius var(--mov-padrao) var(--curva-move), transform var(--mov-rapido) var(--curva-move); }
  .btn-c > * { transition: opacity var(--mov-rapido) var(--curva-move); }
  .btn-c:not([data-estado="parado"]) { border-radius: var(--raio-pilula); }
  .btn-c[data-estado="fechando"] .rot, .btn-c[data-estado="carregando"] .rot, .btn-c[data-estado="salvo"] .rot { opacity: 0; }
  .btn-c[data-estado="carregando"] .spin { opacity: 1; }
  .btn-c[data-estado="salvo"] .ok { opacity: 1; }
  .btn-c[data-estado="salvo"] .ok path { stroke-dashoffset: 0; }
  .btn-c[data-estado="salvo"], .btn-c[data-estado="voltando"] { background: var(--sucesso); color: var(--superficie); }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* celular, so no Com: o botao do topo some nessa largura, entao o painel de baixo abre por este botao redondo */
  .fab { display: none; position: fixed; right: 16px; bottom: 16px; z-index: 10; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 50%; background: var(--destaque); color: var(--destaque-texto); place-items: center; box-shadow: var(--sombra-3); }
  .fab svg { width: 24px; height: 24px; }
  @media (max-width: 639px) { body[data-versao="com"] .fab { display: grid; } }
  .campo { width: 100%; height: 44px; border: 1px solid var(--borda); border-radius: var(--raio-sm); padding: 0 12px; background: var(--fundo); color: var(--texto); font-size: 16px; }
  .campo.erro { border-color: var(--perigo); }
  .erro-campo { color: var(--perigo); font-size: var(--texto-sm); min-height: 18px; }
  .erro-topo { background: #fde8e8; color: #b42318; font-size: 13px; padding: 8px 10px; border-radius: 6px; }
  label.rot { font-size: var(--texto-sm); font-weight: 600; }
  .segurar { position: relative; overflow: hidden; min-height: 44px; border: 0; border-radius: var(--raio); background: var(--perigo-suave); color: var(--perigo); font-weight: 700; }
  .segurar i { position: absolute; inset: 0; width: 0; background: rgb(180 35 24 / .18); }
  .segurar.segurando i { width: 100%; transition: width 1s linear; }
  .segurar span { position: relative; }
  @media (prefers-reduced-motion: reduce) { :root { --t: 0ms; } body[data-versao="com"] .aviso i { display: none; } .btn-c .spin { animation: none; } .sk { animation: none; } }
</style>
</head>
<body data-versao="com" data-velocidade="lento">
<div class="app">
  <aside class="lateral">
    <strong>Acme</strong>
    <nav aria-label="Navegação">
      <a href="#" class="ativo"><i></i>Pedidos</a>
      <a href="#"><i></i>Clientes</a>
      <a href="#"><i></i>Relatórios</a>
      <a href="#"><i></i>Ajustes</a>
    </nav>
  </aside>
  <main>
    <div class="conteudo">
      <header class="topo">
        <div>
          <small>Segunda, 10 de novembro</small>
          <h1>Pedidos da semana com entrega garantida</h1>
        </div>
        <button class="botao apertavel" data-abrir-form>Novo pedido</button>
      </header>

      <div class="espaco"></div>

      <div class="caixa-resumo"><section class="grade resumo" aria-label="Resumo">
        <div class="card"><span class="rotulo">Faturamento hoje</span><span class="numero" data-ao-vivo="faturamento">R$ 0,00</span><span class="sub">atualiza ao vivo</span></div>
        <div class="card"><span class="rotulo">Pedidos</span><span class="numero" data-ao-vivo="pedidos">0</span><span class="sub">hoje</span></div>
        <div class="card"><span class="rotulo">Ticket médio</span><span class="numero" data-ao-vivo="ticket">R$ 0,00</span><span class="sub">últimos 7 dias</span></div>
      </section></div>

      <div class="espaco"></div>

      <section aria-label="Pedidos">
        <div class="titulo-secao">
          <div class="abas" role="tablist">
            <button class="aba apertavel on" data-aba="todos">Todos</button>
            <button class="aba apertavel" data-aba="pagos">Pagos</button>
            <button class="aba apertavel" data-aba="enviados">Enviados</button>
            <button class="aba apertavel" data-aba="cancelados">Cancelados</button>
            <span class="ind" aria-hidden="true"></span>
          </div>
          <button class="botao-sec btn-c apertavel" data-atualizar data-estado="parado"><span class="rot"><svg class="icone-girar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Atualizar</span><svg class="spin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="40 100"/></svg><svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7"/></svg></button>
        </div>
        <div class="lista" data-lista></div>
      </section>

      <div class="espaco"></div>

      <section class="card promo">
        <div class="capa"></div>
        <div>
          <strong>Promoção de fim de ano</strong>
          <div class="sub">48 de 60 pedidos · faltam 15 dias</div>
        </div>
      </section>
    </div>
  </main>
</div>

<button class="fab apertavel" data-abrir-fab aria-label="Novo pedido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<script src="forma.js"></script>
<script>
  const versao = () => document.body.dataset.versao
  const com = () => versao() === 'com'
  const brl = n => 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })

  /* ---------- ajudas de movimento (copiadas de teste/movimento/index.html, espelham movimento.ts) ---------- */
  const msVar = n => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)) || 0
  const dormir = ms => new Promise(r => setTimeout(r, ms))
  const terminou = el => Promise.all(el.getAnimations().map(a => a.finished.catch(() => {})))
  const elastico = (d, limite) => d === 0 || limite <= 0 ? 0 : Math.sign(d) * limite * (1 - 1 / ((Math.abs(d) / limite) * 0.55 + 1))
  const contarValor = (de, para, t) => { const x = Math.min(1, Math.max(0, t)); return de + (para - de) * (1 - (1 - x) ** 3) }
  const LIMITE_ELASTICO = 80
  const celular = () => matchMedia('(max-width: 639px)').matches

  /* ---------- numeros ao vivo: no Com contam ate o valor novo (--mov-contar, ease-out, tabular) ---------- */
  const FMT = { faturamento: brl, pedidos: n => String(Math.round(n)), ticket: brl }
  const contagem = {}
  function mostrar(chave, alvo) {
    const el = document.querySelector(`[data-ao-vivo="${chave}"]`), s = contagem[chave] ??= { v: 0, alvo: 0, raf: 0 }
    cancelAnimationFrame(s.raf); s.alvo = alvo
    if (!com()) { s.v = alvo; el.textContent = FMT[chave](alvo); return }
    const de = s.v, dur = msVar('--mov-contar'), t0 = performance.now()
    const passo = agora => {
      const t = (agora - t0) / dur
      s.v = t >= 1 ? alvo : contarValor(de, alvo, t)
      el.textContent = FMT[chave](s.v)
      if (t < 1) s.raf = requestAnimationFrame(passo)
    }
    s.raf = requestAnimationFrame(passo)
  }
  let fat = 18420.5, ped = 214
  setInterval(() => {
    fat += Math.random() * 180; ped += Math.random() < .5 ? 1 : 0
    mostrar('faturamento', fat); mostrar('pedidos', ped); mostrar('ticket', fat / ped + Math.random())
  }, 500)

  /* ---------- dados ---------- */
  const CORES = ['#f2622e', '#16a34a', '#2563eb', '#a0418f', '#c2710c']
  let pedidos = [
    { id: 1042, itens: '3 itens · Pix', valor: 189.9, status: 'pago' },
    { id: 1041, itens: '1 item · cartão', valor: 49.9, status: 'enviado' },
    { id: 1040, itens: '5 itens · boleto', valor: 612.4, status: 'pago' },
    { id: 1039, itens: '2 itens · Pix', valor: 98.0, status: 'enviado' },
  ]
  const urlAba = () => new URLSearchParams(location.search).get('aba') || 'todos'
  let aba = urlAba()

  const lista = document.querySelector('[data-lista]')
  const skLinha = `<div class="linha" data-sk><div class="miniatura sk"></div><div class="linha-texto"><div class="sk" style="height:12px;width:40%"></div><div class="sk" style="height:10px;width:28%;margin-top:6px"></div></div><div class="sk" style="height:12px;width:56px"></div></div>`
  const skVazio = `<div class="vazio" data-sk-vazio><div class="sk" style="width:44px;height:44px"></div><div class="sk" style="height:12px;width:40%"></div><div class="sk" style="height:10px;width:56%"></div></div>`
  // Sem a tatile: sempre 3 linhas. Com: a forma que a aba tinha da ultima vez (fallback 3, maximo 6)
  function skeleton() {
    const n = com() ? (window.tatileForma?.ler(aba) ?? 3) : 3
    return n === 0 ? skVazio : skLinha.repeat(n)
  }
  function desenhar() {
    const filtro = { todos: () => true, pagos: p => p.status === 'pago', enviados: p => p.status === 'enviado', cancelados: p => p.status === 'cancelado' }[aba]
    const vis = pedidos.filter(filtro)
    window.tatileForma?.gravar(aba, vis.length)
    if (!vis.length) {
      lista.innerHTML = com()
        ? `<div class="vazio" data-vazio><div class="icone-vazio">0</div><strong>Nenhum pedido ${aba === 'todos' ? '' : aba}</strong>Quando houver, eles aparecem aqui.<button class="botao-sec apertavel" data-ir-todos>Ver todos os pedidos</button></div>`
        : `<div class="vazio" data-vazio>Nenhum dado.</div>`
      return
    }
    lista.innerHTML = vis.map(p => `
      <div class="linha" data-pedido="${p.id}">
        <div class="miniatura" style="background:${CORES[p.id % CORES.length]}"></div>
        <div class="linha-texto"><strong>Pedido #${p.id}</strong><span class="sub"><span class="pilula ${p.status === 'pago' ? '' : p.status}">${p.status === 'enviado' ? 'Enviado' : p.status === 'cancelado' ? 'Cancelado' : 'Pago'}</span><span class="corta">${p.itens}</span></span></div>
        <span class="valor numero" style="font-size:var(--texto-base);margin:0">${brl(p.valor)}</span>
        <button class="acoes-linha alvo" data-acoes="${p.id}" aria-label="Ações do pedido ${p.id}"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      </div>`).join('')
  }

  /* ---------- carregar: com a tatile, espera 200 ms antes do skeleton e o mantem 400 ms ---------- */
  const botaoAtualizar = document.querySelector('[data-atualizar]')
  function carregar() {
    const ms = document.body.dataset.velocidade === 'rapido' ? 120 : 1400
    if (!com()) { lista.innerHTML = skeleton(); setTimeout(desenhar, ms); return }
    if (botaoAtualizar.dataset.estado !== 'parado') return // clique repetido: ignorado ate o botao voltar
    const btn = botaoAtualizar, w0 = btn.offsetWidth, h = btn.offsetHeight
    btn.setAttribute('aria-busy', 'true')
    btn.style.width = w0 + 'px'; void btn.offsetWidth // fixa em px antes de animar
    btn.dataset.estado = 'fechando'; btn.style.width = h + 'px'
    const fechou = terminou(btn)
    let desde = 0
    const t = setTimeout(() => { lista.innerHTML = skeleton(); desde = performance.now() }, 200)
    const dados = new Promise(pronto => setTimeout(() => {
      clearTimeout(t)
      const falta = desde ? Math.max(0, 400 - (performance.now() - desde)) : 0
      setTimeout(() => { desenhar(); pronto() }, falta)
    }, ms))
    ;(async () => {
      await fechou
      btn.dataset.estado = 'carregando'
      await Promise.all([dados, dormir(800)]) // uma volta inteira do spinner no minimo: giro de 120 ms parece engasgo
      btn.removeAttribute('aria-busy'); btn.dataset.estado = 'salvo'; await dormir(msVar('--mov-padrao') + 250)
      btn.dataset.estado = 'voltando'; btn.style.width = w0 + 'px'
      await terminou(btn); await dormir(400)
      btn.dataset.estado = 'parado'; btn.style.width = ''
    })()
  }

  /* ---------- abas: com a tatile, vao para a URL e o indicador desliza ---------- */
  const abasEl = document.querySelector('.abas'), ind = abasEl.querySelector('.ind')
  function posicionarAba(animar) {
    const b = abasEl.querySelector('.aba.on'); if (!b) return
    if (!animar) ind.style.transition = 'none' // primeiro posicionamento e redimensionar: sem voar da esquerda
    ind.style.setProperty('--x', b.offsetLeft + 'px'); ind.style.setProperty('--w', b.offsetWidth + 'px'); ind.style.setProperty('--h', b.offsetHeight + 'px')
    if (!animar) { void ind.offsetWidth; ind.style.transition = '' }
  }
  function marcarAba(animar = false) { document.querySelectorAll('[data-aba]').forEach(b => b.classList.toggle('on', b.dataset.aba === aba)); posicionarAba(animar) }
  function fadeAbas() {
    const esq = com() && abasEl.scrollLeft > 1, dir = com() && abasEl.scrollLeft + abasEl.clientWidth < abasEl.scrollWidth - 1
    const f = esq && dir ? 'ambos' : esq ? 'esq' : dir ? 'dir' : ''
    f ? abasEl.dataset.fade = f : abasEl.removeAttribute('data-fade')
  }
  abasEl.addEventListener('scroll', fadeAbas, { passive: true })
  const ro = new ResizeObserver(() => { posicionarAba(false); fadeAbas() }); ro.observe(abasEl); abasEl.querySelectorAll('.aba').forEach(b => ro.observe(b))
  abasEl.addEventListener('click', e => {
    const b = e.target.closest('[data-aba]'); if (!b) return
    aba = b.dataset.aba; marcarAba(true); desenhar()
    if (com()) {
      const u = new URL(location.href)
      aba === 'todos' ? u.searchParams.delete('aba') : u.searchParams.set('aba', aba)
      history.replaceState(null, '', u.pathname + u.search)
    }
  })
  lista.addEventListener('click', e => { if (e.target.closest('[data-ir-todos]')) document.querySelector('[data-aba="todos"]').click() })

  /* ---------- menu de acoes: no Com abre no pointerdown (teclado segue no click, que vem com detail 0) ---------- */
  let menuAberto = null
  function fecharMenu() { menuAberto?.remove(); menuAberto = null }
  function abrirMenu(b) {
    fecharMenu()
    const id = Number(b.dataset.acoes)
    const m = document.createElement('div'); m.className = 'menu'; m.dataset.menu = id
    m.innerHTML = `<button class="apertavel" data-acao="duplicar">Duplicar</button><button class="apertavel" data-acao="arquivar">Arquivar</button><button class="apertavel perigo" data-acao="cancelar">Cancelar pedido</button>`
    b.closest('.linha').style.position = 'relative'
    m.style.top = (b.offsetTop + b.offsetHeight + 4) + 'px'
    b.closest('.linha').appendChild(m); menuAberto = m
    m.addEventListener('click', ev => {
      const item = ev.target.closest('[data-acao]'); if (!item) return
      ev.stopPropagation()
      const executar = () => { fecharMenu(); acao(item.dataset.acao, id) }
      if (com()) { item.classList.add('escolhido'); setTimeout(executar, msVar('--mov-padrao')) } else executar()
    })
  }
  document.addEventListener('pointerdown', e => {
    if (!com() || e.button !== 0) return
    const b = e.target.closest('[data-acoes]'); if (b) abrirMenu(b)
  })
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-acoes]')
    if (!b) { if (!e.target.closest('.menu')) fecharMenu(); return }
    if (com() && e.detail > 0) return // mouse e toque ja abriram no pointerdown
    abrirMenu(b)
  })

  /* ---------- aviso: no Com entra deslizando, tem barra de tempo e sai mais rapido ---------- */
  let avisoT
  function fecharAviso(a) {
    if (!a || a.classList.contains('saindo')) return
    if (!com()) { a.remove(); return }
    a.classList.add('saindo'); setTimeout(() => a.remove(), msVar('--mov-sai-padrao') + 30)
  }
  function avisar(texto, desfazer) {
    document.querySelectorAll('.aviso').forEach(x => x.remove()); clearTimeout(avisoT)
    const tempo = com() && !desfazer ? 3000 : 5000 // com Desfazer a pessoa precisa de mais tempo
    const a = document.createElement('div'); a.className = 'aviso'; a.setAttribute('role', 'status')
    a.style.setProperty('--tempo', tempo + 'ms')
    a.innerHTML = `<span>${texto}</span>${desfazer ? '<button class="apertavel" data-desfazer>Desfazer</button>' : ''}${com() ? '<i></i>' : ''}`
    document.body.appendChild(a)
    if (desfazer) a.querySelector('[data-desfazer]').onclick = () => { desfazer(); fecharAviso(a) }
    avisoT = setTimeout(() => fecharAviso(a), tempo)
  }

  function acao(qual, id) {
    const p = pedidos.find(x => x.id === id)
    if (qual === 'duplicar') {
      pedidos = [{ ...p, id: Math.max(...pedidos.map(x => x.id)) + 1 }, ...pedidos]; desenhar()
      if (com()) avisar('Pedido duplicado')
    }
    if (qual === 'arquivar') {
      if (com()) {
        // otimista: some na hora, Desfazer devolve na mesma posicao
        const pos = pedidos.indexOf(p)
        pedidos = pedidos.filter(x => x !== p); desenhar()
        avisar(`Pedido #${id} arquivado`, () => { pedidos.splice(pos, 0, p); desenhar() })
      } else {
        const linha = lista.querySelector(`[data-pedido="${id}"] .valor`); if (linha) linha.textContent = 'Arquivando...'
        setTimeout(() => { pedidos = pedidos.filter(x => x !== p); desenhar() }, 1200)
      }
    }
    if (qual === 'cancelar') {
      if (!com()) { p.status = 'cancelado'; desenhar(); return } // um toque, sem volta
      abrirPainel(`<h2>Cancelar pedido #${id}?</h2><p class="sub" style="margin:0">O cliente é avisado e o estoque volta.</p>
        <button class="segurar apertavel" data-segurar><i></i><span>Segure para cancelar</span></button><span class="sub" data-msg-segurar></span>
        <button class="botao-sec apertavel" data-fechar>Voltar</button>`)
      const s = document.querySelector('[data-segurar]'), msg = document.querySelector('[data-msg-segurar]')
      let t
      const solta = () => { s.classList.remove('segurando'); clearTimeout(t) }
      s.addEventListener('pointerdown', () => { s.classList.add('segurando'); t = setTimeout(() => { solta(); fecharPainel(); p.status = 'cancelado'; desenhar(); avisar(`Pedido #${id} cancelado`, () => { p.status = 'pago'; desenhar() }) }, 1000) })
      s.addEventListener('pointerup', () => { if (s.classList.contains('segurando')) msg.textContent = 'Soltou antes: nada mudou.'; solta() })
      s.addEventListener('pointerleave', solta)
    }
  }

  /* ---------- painel (formulario e confirmacao) ---------- */
  // Com: celular = painel de baixo com elastico, tablet e desktop = modal. Sem: aparece e some.
  function abrirPainel(html) {
    document.querySelectorAll('.fundo-painel').forEach(x => x.remove())
    const c = com(), folha = c && celular()
    const f = document.createElement('div'); f.className = 'fundo-painel'
    f.innerHTML = `<div class="painel" role="dialog" aria-modal="true">${folha ? '<div class="alca" data-alca></div>' : ''}${html}</div>`
    f.addEventListener('click', e => { if (e.target === f || e.target.closest('[data-fechar]')) fecharPainel() })
    document.body.appendChild(f)
    if (c) { void f.offsetWidth; f.classList.add('aberto') } // o reflow faz a transicao partir do estado fechado
    if (folha) arrastarPainel(f.querySelector('.painel'), f.querySelector('[data-alca]'))
    return f
  }
  function fecharPainel() {
    const f = document.querySelector('.fundo-painel:not(.saindo)'); if (!f) return
    if (!com()) { f.remove(); return }
    f.classList.remove('aberto'); f.classList.add('saindo')
    setTimeout(() => f.remove(), msVar(celular() ? '--mov-sai-lento' : '--mov-sai-padrao') + 30)
  }
  // segue o dedo 1:1 pra baixo, pra cima tem elastico, fecha alem de 30% da altura ou com arremesso
  function arrastarPainel(folha, alca) {
    let y0 = 0, dy = 0, vel = 0, ult = null, arrastando = false
    alca.addEventListener('pointerdown', e => {
      arrastando = true; y0 = e.clientY; dy = 0; vel = 0; ult = { y: e.clientY, t: performance.now() }
      alca.setPointerCapture(e.pointerId); folha.style.transition = 'none'
    })
    alca.addEventListener('pointermove', e => {
      if (!arrastando) return
      dy = e.clientY - y0
      folha.style.transform = `translateY(${dy >= 0 ? dy : -elastico(-dy, LIMITE_ELASTICO)}px)`
      const agora = performance.now()
      if (agora > ult.t) vel = (e.clientY - ult.y) / (agora - ult.t)
      ult = { y: e.clientY, t: agora }
    })
    const soltar = () => {
      if (!arrastando) return
      arrastando = false
      folha.style.transition = ''
      if (dy > folha.offsetHeight * 0.3 || vel > 0.6) { folha.style.transform = ''; fecharPainel() }
      else {
        // volta com mola (--curva-salto passa um pouco e assenta)
        folha.style.transition = 'transform var(--mov-lento) var(--curva-salto)'
        folha.style.transform = ''
        terminou(folha).then(() => (folha.style.transition = ''))
      }
    }
    alca.addEventListener('pointerup', soltar)
    alca.addEventListener('pointercancel', soltar)
  }

  const ICONE_CHECK = '<svg class="ok-campo" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
  const MOTIVO = 'Preencha o e-mail do cliente para criar o pedido.'
  // botao de enviar: a pill fecha ate virar circulo, entra o spinner, fica verde com check e "Salvo"
  async function enviarAnimado(btn) {
    const rot = btn.querySelector('.rot'), w0 = btn.offsetWidth, h = btn.offsetHeight
    btn.setAttribute('aria-disabled', 'true')
    btn.style.width = w0 + 'px'; btn.style.marginInline = 'auto'; void btn.offsetWidth // fixa em px antes de animar
    btn.dataset.estado = 'fechando'; btn.style.width = h + 'px'
    await terminou(btn)
    btn.dataset.estado = 'carregando'; await dormir(900)
    btn.dataset.estado = 'salvo'; await dormir(msVar('--mov-padrao') + 250)
    rot.textContent = 'Salvo'; btn.dataset.estado = 'voltando'; btn.style.width = w0 + 'px'
    await terminou(btn); await dormir(400)
  }

  function abrirForm() {
    const c = com()
    abrirPainel(c ? `<h2>Novo pedido</h2>
      <div class="flut" data-flut><input class="campo" id="email" type="email" name="email" autocomplete="email" spellcheck="false" autocapitalize="off" placeholder="cliente@empresa.com..." aria-describedby="erro-email"><label class="rot-flut" for="email">E-mail do cliente</label>${ICONE_CHECK}</div>
      <span class="erro-campo" id="erro-email" data-erro-email></span>
      <div class="flut"><input class="campo numero" id="valor" name="valor" inputmode="decimal" placeholder="0,00..." style="font-size:16px;margin:0"><label class="rot-flut" for="valor">Valor</label></div>
      <button class="botao btn-c apertavel" data-enviar data-estado="parado" aria-disabled="true" aria-describedby="motivo"><span class="rot">Criar pedido</span><svg class="spin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="40 100"/></svg><svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7"/></svg></button>
      <span class="sub motivo" id="motivo" data-motivo>${MOTIVO}</span>
      <button class="botao-sec apertavel" data-fechar>Cancelar</button>` : `<h2>Novo pedido</h2>
      <div class="erro-topo" data-erro-topo hidden>Erro no formulário.</div>
      <label class="rot" for="email">E-mail do cliente</label>
      <input class="campo" id="email" type="text" placeholder="cliente@empresa.com...">
      <span class="erro-campo" data-erro-email></span>
      <label class="rot" for="valor">Valor</label>
      <input class="campo numero" id="valor" inputmode="decimal" placeholder="0,00" style="font-size:16px;margin:0">
      <button class="botao" data-enviar>Criar pedido</button>
      <button class="botao-sec" data-fechar>Cancelar</button>`)
    const email = document.getElementById('email'), enviar = document.querySelector('[data-enviar]')
    const valido = () => /.+@.+\..+/.test(email.value)
    if (!c) email.addEventListener('paste', e => e.preventDefault()) // sem a tatile: colar bloqueado
    if (c) {
      const flut = email.closest('[data-flut]'), motivo = document.querySelector('[data-motivo]')
      // enquanto falta o e-mail o botao e aria-disabled (segue focavel) e o motivo aparece escrito
      const atualizar = () => {
        const falta = !email.value.trim()
        enviar.setAttribute('aria-disabled', String(falta)); motivo.textContent = falta ? MOTIVO : ''
        if (!valido()) { flut.dataset.valido = 'false'; email.classList.remove('valido') }
      }
      email.addEventListener('input', atualizar)
      // ao sair do campo com valor valido: borda verde e o check entra com salto
      email.addEventListener('blur', () => { const ok = valido(); flut.dataset.valido = String(ok); email.classList.toggle('valido', ok) })
    }
    enviar.addEventListener('click', async () => {
      if (c && enviar.getAttribute('aria-disabled') === 'true') return
      if (valido()) {
        if (c) { await enviarAnimado(enviar); if (!enviar.isConnected) return }
        fecharPainel(); avisar('Pedido criado'); return
      }
      if (c) {
        email.classList.add('erro'); email.focus()
        document.querySelector('[data-erro-email]').textContent = 'Falta o final do e-mail, por exemplo cliente@empresa.com'
      } else document.querySelector('[data-erro-topo]').hidden = false
    })
  }
  document.querySelectorAll('[data-abrir-form], [data-abrir-fab]').forEach(b => b.addEventListener('click', abrirForm))

  botaoAtualizar.addEventListener('click', carregar)

  // a moldura de fora troca versao, tema e velocidade direto no body e chama isto
  window.tatileMudou = () => {
    fecharMenu(); desenhar()
    for (const k in contagem) mostrar(k, contagem[k].alvo) // Sem: valor direto. Com: segue contando
    posicionarAba(false); fadeAbas()
  }
  // tema: no Com a troca e direta (desliga as transicoes por um quadro), igual a trocarTemaSemTransicao de estados.ts. O Sem continua gradual
  function trocarTemaSemTransicao(aplicar) {
    const raiz = document.documentElement
    raiz.classList.add('sem-transicao'); aplicar()
    requestAnimationFrame(() => requestAnimationFrame(() => raiz.classList.remove('sem-transicao')))
  }
  window.tatileTema = t => trocarTemaSemTransicao(() => { document.documentElement.dataset.tema = t })
  marcarAba()
  carregar()
</script>
</body>
</html>
