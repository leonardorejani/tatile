<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatile: movimento</title>
<link rel="stylesheet" href="../../codigo/espaco.css">
<link rel="stylesheet" href="../../codigo/tipo.css">
<link rel="stylesheet" href="../../codigo/forma.css">
<link rel="stylesheet" href="../../codigo/cor.css">
<link rel="stylesheet" href="../../codigo/movimento.css">
<style>
/* palco sempre claro (data-tema="claro" no html): Antes e Depois se comparam iguais */
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:var(--texto-base)/var(--altura-texto) var(--fonte);-webkit-font-smoothing:antialiased}
main{max-width:var(--conteudo-max);margin:0 auto;padding:var(--secao) var(--margem)}
h1{font-size:var(--texto-xl);line-height:var(--altura-titulo);letter-spacing:var(--tracking-titulo);margin:0 0 var(--item)}
.intro{color:var(--texto-2);margin:0 0 var(--secao);max-width:70ch}
.item{background:var(--superficie-2);border-radius:var(--raio-card);padding:var(--pad);margin-bottom:var(--secao)}
.item h2{font-size:var(--texto-md);margin:0 0 var(--item)}
.por{color:var(--texto-2);font-size:var(--texto-sm);margin:0 0 var(--pad);max-width:70ch}
.fonte{display:block;color:var(--texto-3);font-size:var(--texto-xs);margin-top:var(--item)}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:var(--grade)}
.unica{grid-template-columns:1fr}
.lado{border-radius:var(--raio);background:var(--superficie);box-shadow:var(--sombra-1);min-width:0;display:flex;flex-direction:column;overflow:hidden}
.lado>b{font-size:var(--texto-xs);letter-spacing:.04em;text-transform:uppercase;padding:var(--item) var(--icone);color:var(--texto-3);border-bottom:1px solid var(--borda)}
.lado.depois>b{color:var(--sucesso);background:var(--sucesso-suave)}
.palco{padding:var(--pad);flex:1;min-height:140px;display:flex;flex-direction:column;justify-content:center;gap:var(--icone);position:relative;overflow:hidden}
.ctl{display:flex;gap:var(--item);flex-wrap:wrap}
button{font:600 var(--texto-sm)/1 var(--fonte);color:inherit}
.b{height:36px;padding:0 var(--icone);border-radius:var(--raio-sm);border:1px solid var(--borda);background:var(--superficie-2);cursor:pointer}
.b.forte{background:var(--destaque);color:var(--destaque-texto);border-color:transparent}
.dica{font-size:var(--texto-xs);color:var(--texto-3);margin:0}
code{font:var(--texto-xs) ui-monospace,Menlo,monospace}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--item);margin-top:var(--pad)}
.vars code{background:var(--superficie);border-radius:var(--raio-sm);padding:var(--item);box-shadow:var(--sombra-1)}

/* tokens: mesma caixa indo e voltando */
.trilho{height:36px;position:relative;background:var(--superficie-2);border-radius:var(--raio-sm)}
.caixa{position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:var(--raio-sm);background:var(--destaque)}
.antes .caixa{transition:transform 600ms linear}
.depois .caixa{transition:transform var(--mov-padrao) var(--curva-move)}
.depois .caixa.volta{transition-duration:var(--mov-sai-padrao)}
.vai .caixa{transform:translateX(var(--vao,160px))}

/* modal */
.m-veu{position:absolute;inset:0;display:grid;place-items:center;padding:var(--pad)}
.m-caixa{background:var(--superficie);border-radius:var(--raio-card);box-shadow:var(--sombra-3);padding:var(--pad);width:min(100%,260px)}
.m-caixa p{margin:0 0 var(--icone);font-size:var(--texto-sm)}
.antes .m-veu{display:none;background:var(--veu-modal)}
.antes .m-veu.aberto{display:grid}
.depois .m-veu{background:var(--veu-modal);visibility:hidden;opacity:0;transition:opacity var(--mov-sai-padrao) var(--curva-sai),visibility 0s var(--mov-sai-padrao)}
.depois .m-veu.aberto{visibility:visible;opacity:1;transition:opacity var(--mov-padrao) var(--curva-entra),visibility 0s}
.depois .m-caixa{transform:scale(.9);opacity:0;transition:transform var(--mov-sai-padrao) var(--curva-sai),opacity var(--mov-sai-padrao) var(--curva-sai)}
.depois .m-veu.aberto .m-caixa{transform:none;opacity:1;transition:transform var(--mov-padrao) var(--curva-entra),opacity var(--mov-padrao) var(--curva-entra)}

/* painel de baixo */
.pal-sheet{min-height:320px;padding:0;justify-content:flex-start}
.pal-sheet .conteudo{padding:var(--pad)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--superficie);border-radius:var(--raio-card) var(--raio-card) 0 0;box-shadow:var(--sombra-3);padding:0 var(--pad) var(--pad)}
/* prolonga o fundo para baixo: ao puxar alem do topo nao aparece vao */
.sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:200px;background:inherit}
.sheet .alca{display:grid;place-items:center;height:28px;margin:0 calc(var(--pad) * -1);cursor:grab;touch-action:none;user-select:none}
.sheet .alca::before{content:"";width:36px;height:4px;border-radius:var(--raio-pilula);background:var(--borda)}
.sheet p{margin:0 0 var(--item);font-size:var(--texto-sm)}
.antes .sheet{display:none}
.antes .sheet.aberto{display:block}
.depois .sheet{transform:translateY(100%);visibility:hidden;transition:transform var(--mov-sai-lento) var(--curva-sai),visibility 0s var(--mov-sai-lento)}
.depois .sheet.aberto{transform:none;visibility:visible;transition:transform var(--mov-lento) var(--curva-entra),visibility 0s}

/* aviso com barra de tempo */
.aviso{position:absolute;left:var(--pad);right:var(--pad);bottom:var(--pad);background:var(--texto);color:var(--superficie);border-radius:var(--raio);padding:var(--icone) var(--pad);font-size:var(--texto-sm);overflow:hidden;--tempo:3000ms}
.antes .aviso{display:none}
.antes .aviso.aberto{display:block}
.depois .aviso{visibility:hidden;opacity:0;transform:translateY(16px);transition:opacity var(--mov-sai-padrao) var(--curva-sai),transform var(--mov-sai-padrao) var(--curva-sai),visibility 0s var(--mov-sai-padrao)}
.depois .aviso.aberto{visibility:visible;opacity:1;transform:none;transition:opacity var(--mov-padrao) var(--curva-entra),transform var(--mov-padrao) var(--curva-entra),visibility 0s}
.aviso i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--destaque);transform-origin:left;transform:scaleX(0)}
.depois .aviso.aberto i{animation:barra var(--tempo) linear forwards}
@keyframes barra{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* reduzir movimento: a barra esvaziando e movimento, entao some (o aviso continua saindo no tempo dele) */
@media (prefers-reduced-motion:reduce){.depois .aviso.aberto i{animation:none;display:none}}

/* abas com indicador */
.abas{position:relative;display:flex;gap:var(--item);border-bottom:1px solid var(--borda)}
.abas button{background:none;border:0;padding:var(--icone) var(--item);cursor:pointer;color:var(--texto-2)}
.abas button.on{color:var(--texto)}
.abas .ind{position:absolute;left:0;bottom:-1px;height:2px;background:var(--destaque);width:var(--w,0);transform:translateX(var(--x,0));transition:transform var(--mov-padrao) var(--curva-move),width var(--mov-padrao) var(--curva-move)}
.antes .abas button.on{border-bottom:2px solid var(--destaque);margin-bottom:-1px}

/* liga/desliga */
.liga{width:48px;height:28px;border-radius:var(--raio-pilula);border:0;padding:0;background:var(--borda);position:relative;cursor:pointer}
.liga::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--superficie);box-shadow:var(--sombra-1)}
.liga[aria-checked="true"]{background:var(--destaque)}
.liga[aria-checked="true"]::after{left:23px}
.depois .liga{transition:background-color var(--mov-rapido) var(--curva-move)}
.depois .liga::after{left:3px;transform:translateX(0);transition:transform var(--mov-rapido) var(--curva-move)}
.depois .liga[aria-checked="true"]::after{left:3px;transform:translateX(20px)}

/* acordeao */
.acd-item{border-bottom:1px solid var(--borda)}
.acd-gatilho{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:var(--icone) 0;cursor:pointer;text-align:left}
.acd-seta{width:12px;height:12px;border-right:2px solid var(--texto-2);border-bottom:2px solid var(--texto-2);transform:rotate(45deg)}
.acd-item.aberto .acd-seta{transform:rotate(225deg)}
.acd-texto{margin:0;font-size:var(--texto-sm);color:var(--texto-2)}
/* antes: o padding do corpo pula na hora e a grade anima com curva curta: parece travado */
.antes .acd-corpo{display:grid;grid-template-rows:0fr;transition:grid-template-rows 150ms ease-out}
.antes .acd-item.aberto .acd-corpo{grid-template-rows:1fr;padding-bottom:var(--icone)}
.antes .acd-miolo{overflow:hidden;min-height:0}
.antes .acd-seta{transition:transform 150ms ease-out}
/* depois: padding sempre no filho interno (nunca muda), grade e fade e seta na mesma curva */
.depois .acd-corpo{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--mov-padrao) var(--curva-move)}
.depois .acd-item.aberto .acd-corpo{grid-template-rows:1fr}
.depois .acd-miolo{overflow:hidden;min-height:0}
.depois .acd-conteudo{padding:0 0 var(--icone);opacity:0;transition:opacity var(--mov-padrao) var(--curva-move)}
.depois .acd-item.aberto .acd-conteudo{opacity:1}
.depois .acd-seta{transition:transform var(--mov-padrao) var(--curva-move)}

/* botao que carrega: a pill fecha ate virar circulo, so entao entra o spinner.
   width e aceitavel aqui: e um unico botao e a alternativa (clip-path) nao mexe no layout ao redor. */
.btn-c{position:relative;display:inline-grid;place-items:center;align-self:flex-start;height:44px;padding:0;overflow:hidden;border:0;border-radius:var(--raio-pilula);background:var(--destaque);color:var(--destaque-texto);cursor:pointer}
.btn-c{grid-template-columns:minmax(0,1fr);outline:none}
.btn-c:focus-visible{outline:2px solid var(--destaque);outline-offset:3px}
.btn-c>*{grid-area:1/1}
.btn-c .rot{padding:0 var(--pad);white-space:nowrap}
.depois.btn-c,.depois .btn-c{transition:width var(--mov-padrao) var(--curva-move),background-color var(--mov-rapido) var(--curva-move),transform var(--mov-rapido) var(--curva-move)}
.depois .btn-c>*{transition:opacity var(--mov-rapido) var(--curva-move)}
.btn-c .spin,.btn-c .ok{width:22px;height:22px;opacity:0;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
/* gira so enquanto carrega (Depois) e nunca com reduzir movimento: ai o arco fica parado como indicacao */
.antes .btn-c .spin{animation:gira 800ms linear infinite}
.depois .btn-c[data-estado="carregando"] .spin{animation:gira 800ms linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.depois .btn-c[data-estado="carregando"] .spin{animation:none}}
.btn-c .ok path{stroke-dasharray:1;stroke-dashoffset:1}
.depois .btn-c .ok path{transition:stroke-dashoffset var(--mov-padrao) var(--curva-move)}
.btn-c[data-estado="fechando"] .rot,.btn-c[data-estado="carregando"] .rot,.btn-c[data-estado="salvo"] .rot{opacity:0}
.btn-c[data-estado="carregando"] .spin{opacity:1}
.btn-c[data-estado="salvo"] .ok{opacity:1}
.btn-c[data-estado="salvo"] .ok path{stroke-dashoffset:0}
.btn-c[data-estado="salvo"],.btn-c[data-estado="voltando"]{background:var(--sucesso);color:var(--superficie)}
.antes .btn-c{border-radius:var(--raio)}
.antes .btn-c[data-estado="carregando"] .rot{display:none}
.antes .btn-c[data-estado="carregando"]{padding:0 var(--icone)}
.antes .btn-c .spin{display:none}
.antes .btn-c[data-estado="carregando"] .spin{display:block}

/* numero que conta */
.num{font-size:var(--texto-2xl);font-weight:700;text-align:right;letter-spacing:var(--tracking-titulo)}
.depois .num{font-variant-numeric:tabular-nums}

/* troca de icone */
.icones{display:flex;gap:var(--icone);align-items:center}
.ib{width:44px;height:44px;border-radius:var(--raio);border:1px solid var(--borda);background:var(--superficie-2);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{color:var(--destaque)}
.antes .ib .a2{display:none}
.antes .ib[aria-pressed="true"] .a1{display:none}
.antes .ib[aria-pressed="true"] .a2{display:block}

/* lista para detalhe (FLIP) */
.pal-ld{min-height:340px;justify-content:flex-start;padding:0}
.ld-linha{display:flex;align-items:center;gap:var(--icone);padding:var(--item) var(--pad);border:0;border-bottom:1px solid var(--borda);background:none;width:100%;text-align:left;cursor:pointer}
.ld-thumb,.ld-hero{aspect-ratio:16/9;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:var(--raio-sm);flex:none}
.ld-thumb{width:96px}
.ld-det{position:absolute;inset:0;background:var(--superficie);padding:var(--pad);display:flex;flex-direction:column;gap:var(--icone)}
.ld-det[hidden]{display:none}
.ld-hero{width:100%;height:112px;aspect-ratio:auto;flex:none;border-radius:var(--raio-card);transform-origin:0 0}
.ld-det h3{margin:0;font-size:var(--texto-md)}
.ld-det p{margin:0;font-size:var(--texto-sm);color:var(--texto-2)}

/* cabecalho: some ao descer em lista, fica fixo em tabela */
.rol{height:220px;overflow:auto;position:relative;overscroll-behavior:contain}
.pal-rol{padding:0;justify-content:flex-start}
.cab-lista{position:sticky;top:0;z-index:1;background:var(--superficie);padding:var(--icone) var(--pad);font-weight:600;border-bottom:1px solid var(--borda);transition:transform var(--mov-padrao) var(--curva-move)}
.cab-lista.oculto{transform:translateY(-100%)}
.rol-linha{padding:var(--icone) var(--pad);border-bottom:1px solid var(--borda);font-size:var(--texto-sm)}
table{border-collapse:collapse;width:100%;font-size:var(--texto-sm)}
th,td{text-align:left;padding:var(--item) var(--icone);border-bottom:1px solid var(--borda)}
th{position:sticky;top:0;background:var(--superficie-2);z-index:1;box-shadow:0 1px 0 var(--borda)}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* cascata */
.casc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--item)}
.casc li{padding:var(--icone);border-radius:var(--raio-sm);background:var(--superficie-2);font-size:var(--texto-sm)}
.depois .casc.toca li{animation:casc var(--mov-lento) var(--curva-entra) both;animation-delay:calc(var(--i) * var(--mov-cascata))}
@keyframes casc{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

.pressiona{display:flex;gap:var(--icone);flex-wrap:wrap}

@media (max-width:640px){
  .demo{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main>
  <h1>Tatile: movimento</h1>
  <p class="intro">Cada receita do módulo movimento rodando, Antes e Depois. Aperte Tocar e compare. O Depois usa só os tokens de <code>movimento.css</code>. Com "reduzir movimento" ligado no sistema, tudo vira troca direta.</p>
  <div id="raiz"></div>
</main>

<script>
const lado = (rot, html, cls = '') => `<div class="lado ${rot === 'Depois' ? 'depois' : 'antes'}"><b>${rot}</b><div class="palco ${cls}">${html}</div></div>`
const par = (a, d, cls = '') => `<div class="demo">${lado('Antes', a, cls)}${lado('Depois', d, cls)}</div>`
const item = (id, t, por, corpo, fonte) => `<article class="item" id="${id}"><h2>${t}</h2><p class="por">${por}</p>${corpo}<span class="fonte">${fonte}</span></article>`
const bt = (rot, attr, forte) => `<button class="b ${forte ? 'forte ' : ''}apertavel" ${attr}>${rot}</button>`

const icCopiar = '<svg class="a1" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>'
const icCheck = '<svg class="a2" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
const icEstrela = '<svg class="a1" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/></svg>'
const icEstrelaCheia = '<svg class="a2" viewBox="0 0 24 24" style="fill:currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/></svg>'
const icMudo = '<svg class="a1" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 9.5a4 4 0 0 1 0 5"/></svg>'
const icMudoOff = '<svg class="a2" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>'

const cores = [['#60a5fa', '#2563eb'], ['#f59e0b', '#b45309'], ['#34d399', '#047857']]
const linhasLd = ['Pedido #1042', 'Pedido #1041', 'Pedido #1040'].map((n, i) => (q) => `<button class="ld-linha" data-ld-abrir="${q}" data-i="${i}"><span class="ld-thumb" style="--c1:${cores[i][0]};--c2:${cores[i][1]}"></span><span>${n}</span></button>`)
const listaLd = q => linhasLd.map(f => f(q)).join('')
const det = q => `<div class="ld-det" data-ld-det="${q}" hidden><div class="ld-hero" data-hero></div><h3 data-ld-titulo>Pedido</h3><p>3 itens, pago no Pix.</p><div class="ctl"><button class="b apertavel" data-ld-voltar="${q}">Voltar</button></div></div>`

const linhasRol = Array.from({ length: 14 }, (_, i) => `<div class="rol-linha">Mensagem ${i + 1}</div>`).join('')
const linhasTab = Array.from({ length: 12 }, (_, i) => `<tr><td>Pedido ${1042 - i}</td><td>Pix</td><td>R$ ${(120 + i * 17).toFixed(2).replace('.', ',')}</td></tr>`).join('')

const acd = q => `<div class="acd" data-acd="${q}">${['Como funciona o prazo?', 'Posso cancelar?'].map(t => `<div class="acd-item"><button class="acd-gatilho" aria-expanded="false"><span>${t}</span><span class="acd-seta"></span></button><div class="acd-corpo"><div class="acd-miolo"><div class="acd-conteudo"><p class="acd-texto">O prazo conta a partir da confirmação do pagamento. Pedidos no Pix saem em até 1 dia útil e a gente avisa por mensagem quando sair para entrega.</p></div></div></div></div>`).join('')}</div>`

const btnC = q => `<button class="btn-c ${q === 'depois' ? 'apertavel' : ''}" data-btn="${q}" data-estado="parado"><span class="rot">Salvar</span><svg class="spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="40 100"/></svg><svg class="ok" viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7"/></svg></button>`

const modal = q => `${bt('Abrir modal', `data-modal-abrir="${q}"`)}<div class="m-veu" data-modal="${q}"><div class="m-caixa"${q === 'depois' ? ' role="dialog" aria-modal="true" aria-label="Excluir projeto"' : ''}><p><b>Excluir projeto?</b></p><p>Essa ação tem volta por 5 segundos.</p><button class="b forte apertavel" data-modal-fechar="${q}">Entendi</button></div></div>`
const sheet = q => `<div class="conteudo">${bt('Abrir painel', `data-sheet-abrir="${q}"`)}<p class="dica" style="margin-top:8px">${q === 'depois' ? 'Puxe a alça para baixo (fecha além de 30%) ou para cima (elástico).' : 'Sem gesto: aparece e some.'}</p></div><div class="sheet" data-sheet="${q}"${q === 'depois' ? ' role="dialog" aria-label="Compartilhar pedido"' : ''}><div class="alca" data-alca="${q}"></div><p><b>Compartilhar pedido</b></p><p>Escolha para quem enviar o resumo.</p><button class="b apertavel" data-sheet-fechar="${q}">Fechar</button></div>`
const aviso = q => `${bt('Mostrar aviso', `data-aviso-abrir="${q}"`)}<div class="aviso" data-aviso="${q}">Pedido enviado<i></i></div>`
const abas = () => `<div class="abas" data-abas>${['Pedidos', 'Clientes', 'Relatórios'].map((n, i) => `<button class="${i === 0 ? 'on' : ''}">${n}</button>`).join('')}<span class="ind"></span></div>`
const liga = () => `<div class="icones"><button class="liga apertavel" role="switch" aria-checked="false" aria-label="Notificações"></button><span class="dica" data-liga-txt>Desligado</span></div>`
const iconeBtns = (depois) => `<div class="icones">${[[icCopiar, icCheck, 'Copiar'], [icEstrela, icEstrelaCheia, 'Favoritar'], [icMudo, icMudoOff, 'Silenciar']].map(([a, b, n]) => `<button class="ib apertavel" aria-pressed="false" aria-label="${n}" data-ic>${depois ? `<span class="troca-icone">${a}${b}</span>` : `${a}${b}`}</button>`).join('')}</div>`
const cascata = () => `<ul class="casc" data-casc>${['Crie seu primeiro pedido', 'Convide a equipe', 'Conecte o WhatsApp', 'Escolha a forma de pagamento', 'Imprima o cartaz', 'Pronto'].map((t, i) => `<li style="--i:${i}">${t}</li>`).join('')}</ul>`

const raiz = document.getElementById('raiz')
raiz.innerHTML = [
  item('tokens', 'Tokens de movimento: duração e curva por papel', 'No Antes, 600 ms linear para ir e para voltar. No Depois, 320 ms com curva gradual para ir e 220 ms para voltar (saída a 70%).',
    par(`<div class="trilho" data-trilho><div class="caixa"></div></div>${bt('Tocar', 'data-tocar="antes"')}`, `<div class="trilho" data-trilho><div class="caixa"></div></div>${bt('Tocar', 'data-tocar="depois"')}`)
    + `<div class="vars"><code>--mov-rapido 180ms</code><code>--mov-padrao 320ms</code><code>--mov-lento 480ms</code><code>--mov-sai-rapido 130ms</code><code>--mov-sai-padrao 220ms</code><code>--mov-sai-lento 340ms</code></div>`,
    'motion-prompt, Emil Kowalski, Jakub Krehel'),
  item('modal', 'Modal cresce de 0,9 com fundo a 42%', 'Abre em --mov-padrao com --curva-entra e fecha em --mov-sai-padrao.', par(modal('antes'), modal('depois')), 'motion-prompt #049'),
  item('sheet', 'Painel de baixo com elástico', 'Sobe em --mov-lento, segue o dedo 1:1, fecha ao puxar além de 30% da altura ou com velocidade, e puxar para cima além do topo tem resistência e volta com mola.', par(sheet('antes'), sheet('depois'), 'pal-sheet'), 'motion-prompt #051'),
  item('aviso', 'Aviso com barra de tempo', 'Sobe com fade e a barra de 3 px esvazia em linear, 3 segundos.', par(aviso('antes'), aviso('depois'), 'pal-aviso'), 'motion-prompt #056'),
  item('abas', 'Indicador de aba que desliza', 'Um indicador só, que anda e muda de largura (transform e width com --curva-move), no lugar de um traço que pula de aba.', par(abas(), abas()), 'motion-prompt #057, #060'),
  item('liga', 'Liga/desliga', 'A bolinha anda com transform em --mov-rapido, junto com a cor do fundo.', par(liga(), liga()), 'motion-prompt #059'),
  item('acordeao', 'Acordeão liso', 'O Antes pula porque o padding do conteúdo muda na hora e a grade anima com curva curta. No Depois o padding fica num filho interno que nunca muda e grade, fade e seta usam a mesma curva.', par(acd('antes'), acd('depois')), 'motion-prompt #052'),
  item('botao', 'Botão que carrega: a pill fecha até virar círculo', 'Mede a largura, fixa em px, anima até altura x altura, só então entra o spinner. Depois o verde com check que se desenha e a largura volta animada.', par(btnC('antes'), btnC('depois')), 'motion-prompt #160'),
  item('numero', 'Número que conta', '600 ms com ease-out e tabular-nums para os dígitos não tremerem.', par(`<div class="num" data-num="antes">R$ 1.280,00</div>${bt('Mudar valor', 'data-num-tocar="antes"')}`, `<div class="num" data-num="depois">R$ 1.280,00</div>${bt('Mudar valor', 'data-num-tocar="depois"')}`), 'motion-prompt #007'),
  item('icone', 'Troca de ícone com desfoque', 'Para todo ícone clicável de estado: copiar, favoritar, silenciar. O velho sai com desfoque e encolhendo, o novo entra ao contrário, 200 ms.', par(iconeBtns(false), iconeBtns(true)), 'Jakub Krehel'),
  item('lista', 'Lista para detalhe: a foto viaja e volta', 'A imagem da linha cresce até o detalhe e, ao voltar, faz o mesmo caminho ao contrário (FLIP, 480 ms).', par(`<div class="rol" style="height:auto">${listaLd('antes')}</div>${det('antes')}`, `<div class="rol" style="height:auto">${listaLd('depois')}</div>${det('depois')}`, 'pal-ld'), 'motion-prompt #161'),
  item('cabecalho', 'Cabeçalho que some ao descer: só em lista', 'Em lista o cabeçalho sai ao descer e volta ao subir. Em tabela ele fica fixo, para a pessoa não se perder nas colunas.',
    `<div class="demo"><div class="lado depois"><b>Lista: some ao descer</b><div class="palco pal-rol"><div class="rol" id="rol-lista"><div class="cab-lista" id="cab-lista">Mensagens</div>${linhasRol}</div></div></div><div class="lado depois"><b>Tabela: fica fixo</b><div class="palco pal-rol"><div class="rol" id="rol-tabela"><table><thead id="cab-tabela"><tr><th>Pedido</th><th>Forma</th><th>Valor</th></tr></thead><tbody>${linhasTab}</tbody></table></div></div></div></div>`, 'motion-prompt #149'),
  item('cascata', 'Entrada em cascata com desfoque', '80 ms entre itens, 8 px, desfoque de 8 px, no máximo 6 itens. Só para onboarding e tela vazia.', par(`${cascata()}${bt('Tocar', 'data-casc-tocar="antes"')}`, `${cascata()}${bt('Tocar', 'data-casc-tocar="depois"')}`), 'Jakub Krehel'),
  item('aperta', 'Retorno ao apertar', 'Todo botão e ícone clicável encolhe para 0,97 ao apertar (classe .apertavel).', par(`<div class="pressiona"><button class="b forte">Confirmar</button><button class="b">Cancelar</button></div>`, `<div class="pressiona"><button class="b forte apertavel">Confirmar</button><button class="b apertavel">Cancelar</button></div>`), 'motion-prompt #158, Emil Kowalski'),
].join('')

/* ---------- ajudas ---------- */
const $ = (s, r = document) => r.querySelector(s)
const $$ = (s, r = document) => [...r.querySelectorAll(s)]
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const msVar = n => parseFloat(cssVar(n)) || 0
const dormir = ms => new Promise(r => setTimeout(r, ms))
const quadro = () => new Promise(r => requestAnimationFrame(() => r()))
const terminou = el => Promise.all(el.getAnimations().map(a => a.finished.catch(() => {})))
// espelham movimento.ts (elastico e contarValor): a pagina nao importa TS
const elastico = (d, limite) => d === 0 || limite <= 0 ? 0 : Math.sign(d) * limite * (1 - 1 / ((Math.abs(d) / limite) * 0.55 + 1))
const contarValor = (de, para, t) => { const x = Math.min(1, Math.max(0, t)); return de + (para - de) * (1 - (1 - x) ** 3) }

/* tokens */
$$('[data-tocar]').forEach(b => b.addEventListener('click', () => {
  const tr = b.closest('.palco').querySelector('[data-trilho]')
  tr.style.setProperty('--vao', tr.clientWidth - 36 + 'px')
  const caixa = tr.querySelector('.caixa')
  const indo = !tr.classList.contains('vai')
  caixa.classList.toggle('volta', !indo)
  tr.classList.toggle('vai', indo)
}))

/* modal */
// camada (modal e painel de baixo do Depois): Esc fecha, foco entra, Tab circula e o foco volta ao gatilho
let camada = null
const focaveis = r => $$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', r).filter(e => !e.disabled)
const abrirCamada = (chave, raiz, gatilho, fechar) => { camada = { chave, raiz, gatilho, fechar }; focaveis(raiz)[0]?.focus({ preventScroll: true }) } // sem rolar: o painel ainda esta fora do palco (overflow hidden) quando o foco entra
const soltarCamada = chave => { if (camada?.chave !== chave) return; const g = camada.gatilho; camada = null; g.focus() }
document.addEventListener('keydown', e => {
  if (!camada) return
  if (e.key === 'Escape') { e.preventDefault(); camada.fechar(); return }
  if (e.key !== 'Tab') return
  const f = focaveis(camada.raiz), a = document.activeElement
  if (!f.length) { e.preventDefault(); return }
  if (!camada.raiz.contains(a)) { e.preventDefault(); f[0].focus() }
  else if (e.shiftKey && a === f[0]) { e.preventDefault(); f[f.length - 1].focus() }
  else if (!e.shiftKey && a === f[f.length - 1]) { e.preventDefault(); f[0].focus() }
})
const fecharModal = q => { $(`[data-modal="${q}"]`).classList.remove('aberto'); if (q === 'depois') soltarCamada('modal') }
$$('[data-modal-abrir]').forEach(b => b.addEventListener('click', () => {
  const q = b.dataset.modalAbrir, v = $(`[data-modal="${q}"]`)
  v.classList.add('aberto')
  if (q === 'depois') abrirCamada('modal', $('.m-caixa', v), b, () => fecharModal(q))
}))
$$('[data-modal-fechar]').forEach(b => b.addEventListener('click', () => fecharModal(b.dataset.modalFechar)))

/* aviso */
const timers = {}
$$('[data-aviso-abrir]').forEach(b => b.addEventListener('click', () => {
  const q = b.dataset.avisoAbrir, a = $(`[data-aviso="${q}"]`)
  a.classList.remove('aberto'); void a.offsetWidth; a.classList.add('aberto')
  clearTimeout(timers[q]); timers[q] = setTimeout(() => a.classList.remove('aberto'), 3000)
}))

/* abas */
$$('[data-abas]').forEach(g => {
  const ind = $('.ind', g)
  const ir = b => { ind.style.setProperty('--x', b.offsetLeft + 'px'); ind.style.setProperty('--w', b.offsetWidth + 'px'); $$('button', g).forEach(x => x.classList.toggle('on', x === b)) }
  // sem transicao no primeiro posicionamento
  ind.style.transition = 'none'; ir($('button.on', g)); void ind.offsetWidth; ind.style.transition = ''
  g.addEventListener('click', e => { const b = e.target.closest('button'); if (b) ir(b) })
})

/* liga/desliga */
$$('.liga').forEach(b => b.addEventListener('click', () => {
  const on = b.getAttribute('aria-checked') !== 'true'
  b.setAttribute('aria-checked', String(on)); b.nextElementSibling.textContent = on ? 'Ligado' : 'Desligado'
}))

/* acordeao */
$$('.acd-gatilho').forEach(b => b.addEventListener('click', () => {
  const it = b.parentElement
  const abre = !it.classList.contains('aberto')
  it.classList.toggle('aberto', abre); b.setAttribute('aria-expanded', String(abre))
}))

/* botao que carrega */
$$('[data-btn]').forEach(btn => btn.addEventListener('click', async () => {
  if (btn.dataset.estado !== 'parado') return
  const rot = $('.rot', btn)
  if (btn.dataset.btn === 'antes') {
    btn.dataset.estado = 'carregando'; await dormir(1400)
    btn.dataset.estado = 'parado'; rot.textContent = 'Salvo'; await dormir(1200); rot.textContent = 'Salvar'
    return
  }
  const w0 = btn.offsetWidth, h = btn.offsetHeight
  btn.style.width = w0 + 'px'; void btn.offsetWidth        // fixa em px antes de animar
  btn.dataset.estado = 'fechando'
  btn.style.width = h + 'px'                                // vira circulo
  await terminou(btn)
  btn.dataset.estado = 'carregando'; await dormir(1400)
  btn.dataset.estado = 'salvo'; await dormir(msVar('--mov-padrao') + 500)
  rot.textContent = 'Salvo'; btn.dataset.estado = 'voltando'; btn.style.width = w0 + 'px'
  await terminou(btn); await dormir(1200)
  rot.textContent = 'Salvar'; btn.dataset.estado = 'parado'; btn.style.width = ''
}))

/* numero que conta */
const fmt = v => 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.')
$$('[data-num-tocar]').forEach(b => b.addEventListener('click', () => {
  const q = b.dataset.numTocar, el = $(`[data-num="${q}"]`)
  // alvo alterna, mas a contagem parte do que esta na tela agora (clique no meio da contagem nao pula)
  const alvo = parseFloat(el.dataset.v ?? '1280'), para = alvo === 1280 ? 3947.5 : 1280
  const de = el._atual ?? alvo
  el.dataset.v = para
  if (q === 'antes') { el.textContent = fmt(para); return }
  cancelAnimationFrame(el._raf)
  const dur = msVar('--mov-contar'), t0 = performance.now()
  const passo = agora => {
    const t = (agora - t0) / dur
    el._atual = contarValor(de, para, t); el.textContent = fmt(el._atual)
    if (t < 1) el._raf = requestAnimationFrame(passo)
  }
  el._raf = requestAnimationFrame(passo)
}))

/* troca de icone */
$$('[data-ic]').forEach(b => b.addEventListener('click', () => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'))))

/* painel de baixo com elastico */
const LIMITE_ELASTICO = 80
const fecharSheet = q => { $(`[data-sheet="${q}"]`).classList.remove('aberto'); if (q === 'depois') soltarCamada('sheet') }
$$('[data-sheet-abrir]').forEach(b => b.addEventListener('click', () => {
  const q = b.dataset.sheetAbrir, s = $(`[data-sheet="${q}"]`)
  s.classList.add('aberto')
  if (q === 'depois') abrirCamada('sheet', s, b, () => fecharSheet(q))
}))
$$('[data-sheet-fechar]').forEach(b => b.addEventListener('click', () => fecharSheet(b.dataset.sheetFechar)))
{
  const sheet = $('[data-sheet="depois"]'), alca = $('[data-alca="depois"]')
  let y0 = 0, dy = 0, vel = 0, ult = null, arrastando = false
  alca.addEventListener('pointerdown', e => {
    arrastando = true; y0 = e.clientY; dy = 0; vel = 0; ult = { y: e.clientY, t: performance.now() }
    alca.setPointerCapture(e.pointerId); sheet.style.transition = 'none'
  })
  alca.addEventListener('pointermove', e => {
    if (!arrastando) return
    dy = e.clientY - y0
    // para baixo segue o dedo 1:1, para cima (alem do topo) tem resistencia
    sheet.style.transform = `translateY(${dy >= 0 ? dy : -elastico(-dy, LIMITE_ELASTICO)}px)`
    const agora = performance.now()
    if (agora > ult.t) vel = (e.clientY - ult.y) / (agora - ult.t)
    ult = { y: e.clientY, t: agora }
  })
  const soltar = () => {
    if (!arrastando) return
    arrastando = false
    sheet.style.transition = ''
    if (dy > sheet.offsetHeight * 0.3 || vel > 0.6) { fecharSheet('depois'); sheet.style.transform = '' }
    else {
      // volta com mola (--curva-salto passa um pouco e assenta)
      sheet.style.transition = 'transform var(--mov-lento) var(--curva-salto)'
      sheet.style.transform = ''
      terminou(sheet).then(() => (sheet.style.transition = ''))
    }
  }
  alca.addEventListener('pointerup', soltar)
  alca.addEventListener('pointercancel', soltar)
}

/* lista para detalhe: FLIP, a volta faz o caminho inverso */
const quadros = (de, para) => {
  const sx = de.width / para.width, sy = de.height / para.height
  return [{ transform: `translate(${de.left - para.left}px, ${de.top - para.top}px) scale(${sx}, ${sy})` }, { transform: 'none' }]
}
const opcoesFlip = () => ({ duration: msVar('--mov-lento'), easing: cssVar('--curva-move'), fill: 'both' })
$$('[data-ld-abrir]').forEach(l => l.addEventListener('click', async () => {
  const q = l.dataset.ldAbrir, d = $(`[data-ld-det="${q}"]`), hero = $('[data-hero]', d), thumb = $('.ld-thumb', l)
  hero.style.setProperty('--c1', thumb.style.getPropertyValue('--c1')); hero.style.setProperty('--c2', thumb.style.getPropertyValue('--c2'))
  $('[data-ld-titulo]', d).textContent = l.textContent.trim()
  d.hidden = false
  d.dataset.de = l.dataset.i
  if (q === 'antes') return
  const de = thumb.getBoundingClientRect(), para = hero.getBoundingClientRect()
  d.animate([{ opacity: 0 }, { opacity: 1 }], opcoesFlip())
  hero.animate(quadros(de, para), opcoesFlip())
}))
$$('[data-ld-voltar]').forEach(b => b.addEventListener('click', async () => {
  const q = b.dataset.ldVoltar, d = $(`[data-ld-det="${q}"]`), hero = $('[data-hero]', d)
  if (q === 'antes') { d.hidden = true; return }
  const thumb = $$('.ld-thumb', d.parentElement)[Number(d.dataset.de)]
  const de = thumb.getBoundingClientRect(), para = hero.getBoundingClientRect()
  const op = opcoesFlip()
  d.animate([{ opacity: 1 }, { opacity: 0 }], op)
  const a = hero.animate(quadros(de, para).reverse(), op)   // o mesmo caminho, ao contrario
  await a.finished.catch(() => {})
  d.hidden = true
}))

/* cabecalho que some ao descer, so em lista */
{
  const rol = $('#rol-lista'), cab = $('#cab-lista')
  let ultimo = 0
  rol.addEventListener('scroll', () => {
    const y = rol.scrollTop, delta = y - ultimo
    if (Math.abs(delta) < 4) return
    cab.classList.toggle('oculto', delta > 0 && y > cab.offsetHeight)
    ultimo = y
  }, { passive: true })
}

/* cascata */
$$('[data-casc-tocar]').forEach(b => b.addEventListener('click', () => {
  const ul = $('[data-casc]', b.closest('.palco'))
  ul.classList.remove('toca'); void ul.offsetWidth; ul.classList.add('toca')
}))
</script>
