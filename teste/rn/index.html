<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Skeleton adaptativo RN</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #f6f7f9; font-family: -apple-system, system-ui, sans-serif; }
      #root { display: flex; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <nav class="recarregar" aria-label="Controles do teste">
      <a href="../">Voltar</a>
      <button onclick="location.reload()">Recarregar</button>
    </nav>
    <style>
      .recarregar { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 8px; z-index: 10; }
      .recarregar a, .recarregar button { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; font: 600 14px -apple-system, system-ui, sans-serif; display: flex; align-items: center; text-decoration: none; box-shadow: 0 6px 20px -6px rgba(0,0,0,.35); cursor: pointer; }
      .recarregar a { background: #fff; color: #15181d; }
      .recarregar button { background: #2563eb; color: #fff; }
    </style>
    <script type="module" src="./app.js"></script>
  </body>
</html>
