<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Skeleton adaptativo web</title>
    <link rel="stylesheet" href="../../codigo/espaco.css" />
    <link rel="stylesheet" href="../../codigo/forma.css" />
    <style>
      :root { --bg: #f6f7f9; --card: #fff; --texto: #15181d; --texto-2: #5d6673; --borda: #e6e9ee; --sk: #e3e6eb; --azul: #2563eb; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--texto); font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
      button { font: inherit; touch-action: manipulation; cursor: pointer; }
      input, select, textarea { font-size: 16px; }

      .app { display: flex; flex-direction: column; min-height: 100dvh; }
      /* celular: barra no topo. 768+: menu lateral (corte do modulo pwa) */
      .menu { display: flex; align-items: center; gap: var(--item); height: 56px; padding: 0 var(--margem); background: var(--card); border-bottom: 1px solid var(--borda); }
      .menu .marca { font-weight: 700; }
      .menu nav, .menu .recolher { display: none; }
      @media (min-width: 768px) {
        .app { flex-direction: row; }
        .menu { flex-direction: column; align-items: stretch; width: 220px; height: auto; flex: none; padding: 24px 12px; gap: 4px; border-bottom: 0; border-right: 1px solid var(--borda); }
        .menu.recolhido { width: 72px; }
        .menu .marca { height: 32px; padding: 0 12px; margin-bottom: 16px; white-space: nowrap; overflow: hidden; }
        .menu nav { display: flex; flex-direction: column; gap: 4px; }
        .menu nav a { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: var(--texto-2); text-decoration: none; white-space: nowrap; overflow: hidden; }
        .menu nav a.ativo { background: #eef3fe; color: var(--azul); font-weight: 600; }
        .menu nav i { width: 20px; height: 20px; border-radius: 6px; background: currentColor; opacity: .25; flex: none; }
        .menu.recolhido nav span, .menu.recolhido .marca span { display: none; }
        .menu .recolher { display: flex; align-items: center; justify-content: center; margin-top: auto; height: 40px; border: 0; border-radius: 10px; background: var(--bg); color: var(--texto-2); }
      }

      main { flex: 1; min-width: 0; }
      .conteudo { max-width: var(--conteudo-max); margin: 0 auto; padding: var(--margem) var(--margem) 120px; }
      .topo { display: flex; align-items: center; justify-content: space-between; height: 56px; }
      .topo h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
      .topo small { display: block; color: var(--texto-2); font-size: 13px; }

      .card { background: var(--card); border-radius: 16px; padding: var(--pad); box-shadow: 0 0 0 1px var(--borda); }
      .espaco { height: var(--secao); }

      /* resumo: aberto mostra os numeros, fechado so a barra */
      .painel-barra { display: flex; align-items: center; justify-content: space-between; height: 44px; }
      .painel-barra strong { font-size: 15px; }
      .painel-numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--grade); margin-top: var(--item); height: 56px; }
      .painel-numeros div { display: flex; flex-direction: column; justify-content: center; }
      .painel-numeros b { font-size: 22px; font-variant-numeric: tabular-nums; }
      .painel-numeros span { font-size: 13px; color: var(--texto-2); }
      .botao { min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: #e8ebf0; color: var(--texto); font-size: 14px; }
      @media (pointer: fine) { .botao { min-height: 36px; } }

      /* quadro: secoes empilhadas; 1024+ tres colunas */
      .quadro { display: grid; grid-template-columns: 1fr; gap: var(--secao); align-items: start; }
      @media (min-width: 1024px) { .quadro { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--grade); } }
      .coluna { display: flex; flex-direction: column; gap: var(--item); }
      .col-titulo { display: flex; align-items: center; justify-content: space-between; height: 28px; }
      .col-titulo h2 { margin: 0; font-size: 17px; }
      .col-titulo span { color: var(--texto-2); font-size: 13px; font-variant-numeric: tabular-nums; }
      /* skeleton e card real tem a MESMA estrutura e as mesmas medidas internas */
      .capa { height: 120px; border-radius: 10px; background: #f2622e; margin-bottom: var(--item); }
      .card-linha { display: flex; align-items: center; justify-content: space-between; gap: var(--icone); height: 44px; }
      .card-linha strong { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .acoes { display: flex; gap: var(--item); height: 44px; align-items: center; }

      .sk { background: var(--sk); border-radius: 6px; animation: pulso 1.2s ease-in-out infinite; }
      .sk.capa { border-radius: 10px; }
      .sk-linha { display: block; height: 12px; width: 55%; }
      .sk-botao { width: 120px; height: 36px; border-radius: 10px; }
      @keyframes pulso { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

      /* arrastar card: so token. Card pego sai do fluxo (fixed) e a vaga segura o lugar dele */
      .card[data-id] { position: relative; cursor: grab; }
      .card[data-id]:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
      .alca { display: grid; place-items: center; flex: none; width: 44px; height: 44px; color: var(--texto-2); touch-action: none; }
      .alca i { width: var(--item); height: var(--pad); background: radial-gradient(circle, currentColor 25%, transparent 30%) 0 0 / calc(var(--item) / 2) calc(var(--item) / 2); }
      .card.pego { z-index: 5; scale: 1.03; box-shadow: var(--sombra-3); cursor: grabbing; }
      .card.voando { position: fixed; margin: 0; }
      .card.teclado { outline: 2px solid var(--azul); outline-offset: 2px; }
      .card.vaga { background: var(--sk); box-shadow: none; opacity: .6; }
      @media (prefers-reduced-motion: no-preference) { .card[data-id] { transition: scale 150ms cubic-bezier(.65,0,.35,1), box-shadow 150ms cubic-bezier(.65,0,.35,1); } }
      .so-leitor { position: absolute; width: 1px; height: 1px; margin: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      .rodape { height: 96px; }

      .recarregar { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 8px; z-index: 10; }
      .recarregar a, .recarregar button { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; font: 600 14px -apple-system, system-ui, sans-serif; display: flex; align-items: center; text-decoration: none; box-shadow: 0 6px 20px -6px rgba(0,0,0,.35); }
      .recarregar a { background: #fff; color: #15181d; }
      .recarregar button { background: var(--azul); color: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <nav class="recarregar" aria-label="Controles do teste">
      <a href="../">Voltar</a>
      <button onclick="location.reload()">Recarregar</button>
    </nav>
    <script type="module" src="./app.js"></script>
  </body>
</html>
